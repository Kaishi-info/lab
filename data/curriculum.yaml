  summary: この授業では、現代社会で必要な「情報を正しく扱う力」について学ぶ。まず、情報リテラシーとは何か、その基本的な考え方や大切さを理解する。次に、情報のさまざまな形や、それを使うための便利なツールについて学ぶ。そして、情報を見つける方法や、正しく読み取って分析するコツを学ぶ。さらに、自分の考えをわかりやすく伝えるための情報のまとめ方や伝え方も学ぶ。また、情報を守るためのルールやマナー、法律についても基本的なポイントを押さえる。最後に、情報を正しく判断する力を身につけるため、人間が持つ思考のクセ（ヒューリスティックスやバイアス）について学ぶ。

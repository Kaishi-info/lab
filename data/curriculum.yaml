- id: A008
  name: 生成AI活用
  category: 基礎教育科目
  area: 学修基盤
  form: 講義
  grade: 1年次
  term: 前期・後期
  credits: 2
  required: true
  dp:
    - A
  summary: プロンプトエンジニアリングの基本を学びながら、AIの魅力的な世界を探求する。プロンプトエンジニアリングとは、コンピュータに指示を与えて、特定のタスクを実行させる方法である。コースの初めには、シンプルな例を使ってコンピュータとどのように「話す」かについて学ぶ。次に、生成モデルという、コンピュータが新しいデータを「作成」する方法について簡単に学ぶ。例えば、新しい画像や文章を作成する方法である。学生は、実際の小さなプロジェクトを通じて、この技術を使って自分で何かを作成する楽しさを体験する。また、AIの使用が私たちの社会にどのような影響を与えるかについても簡単に議論する。このコースは、主に文章を生成するためのプロンプトエンジニアリングの基本スキルを学び、AIの創造的な側面を初めて体験することを目指す。全体を通じて、AIの基本的な知識を身につけ、将来の大学における学習の基盤を築くことができる。

  dp:
    - A
  summary: 情報技術の根幹であるコンピュータと通信ネットワーク、そしてスマホなど個人端末では、全て半導体チップというハードウェアで情報処理されている。特に、最近では目的特化したキーデバイスを武器にする、GAFAに代表されるテクノロジー企業が台頭しており、これらの多品種少量チップの生産に適した、超小型半導体製造システム・ミニマルファブをメインテーマとして、トランジスタの動作原理と作り方から始まり、半導体チップの製造システム、製造技術を中心に、デバイスと集積回路の設計方法、多品種少量の実際のマーケティング分析、半導体産業の産業構造、ビジネスモデルまでを学ぶ。
  teachers:
    - name: 原 史朗
- id: Y311
  name: 深層学習基礎
  category: 専門教育科目
  area: 情報・工学系（先端IT）
  form: 講義
  grade: 3年次
  term: 前期・後期
  credits: 2
  required: false
  dp:
    - A
  summary: |-
    AI技術の根底にある理論と、特に画像認識に焦点を当てたニューラルネットワークの構築方法を学ぶ。このコースは、ディープラーニングの進化の歴史から始め、汎用的なニューラルネットワークの基本概念、そして画像認識に特化した畳み込みニューラルネットワーク（CNN）へと進んでいく。言語処理や時系列データ分析に適用されるシーケンスモデルも紹介するが、主な比重は画像処理技術に置かれる。データの準備段階から、オントロジーやオーグメンテーションの手法を通じて、より良いモデル学習のための基礎を築いていく。また、AIモデルの偏りの識別、システムの安定性確保、そして精度向上のためのアンサンブル学習の重要性についても学ぶ。
    ディープラーニングの基礎知識をしっかりと身に付け、将来的な応用分野への理解を深めることができる。
  teachers:
    - name: 中塚 晶仁
- id: Y405
  name: 深層学習応用
  category: 専門教育科目
  area: 情報・工学系（先端IT）
  form: 講義
  grade: 4年次
  term: 前期・後期
  credits: 2
  required: false
  dp:
    - C
  summary: ディープラーニングの進化は、技術革新の最前線を塗り替えている。本科目では、生成系ニューラルネットワークを中心に、画像生成技術から言語処理技術まで、ディープラーニングの応用分野を幅広く学ぶ。特に、画像系の技術に重点を置き、Stable Diffusionのような最先端の画像生成モデルや、言語理解と生成に革命をもたらすLLAMAなど、実際にデプロイして体験することで、理論だけでなく実践的な技能も身につけていく。また、データ解析から先端サービスの開発に至るまで、ディープラーニングが如何にして新たな価値を生み出しているかを探求していく。
  teachers:
    - name: 中塚 晶仁
- id: G112
  name: ゲームプランとゲームシナリオのデザイン
  category: 専門教育科目
  area: 情報・工学系
  form: 講義
  grade: 3年次
  term: 前期・後期
  credits: 2
  required: false
  dp:
    - C
  summary: |-
    本講義では、ゲームデザインを設計するためには何が必要なのかを分析し、独自性のあるゲームの企画を提案できるように学修する。講義の中で、企画書や仕様書や指示書の作り方を学んだり、伝わりやすいプレゼンテーションの方法を学んだり、レベルデザインの考え方や、ストーリーテリングやゲームシナリオの書き方を学んだり、絵コンテや字コンテを作ったり、ビジネスフレームワークを実践したりと、特に、ゲームデザイナー（プランナー）向けの内容になっている。
    本講義は、独自性のあるゲームデザインを設計するための基礎的な考え方や、制作技法を身に付け、ゲームデザイナー（プランナー）として、企画・シナリオのスキルを得ることができる。加えて、ゲーム構成法の基本的な知見も学修していく。
  teachers:
    - name: 川上 大典
- id: G113
  name: 金融工学入門
  category: 専門教育科目
  area: 情報・工学系
  form: 講義
  grade: 3年次
  term: 前期・後期
  credits: 1
  required: false
  dp:
    - C
  summary: 本講義の目的は、金融工学の基本概念と応用をわかりやすく学ぶことである。金融工学はリスクとリターンの管理を中心に発展してきた学問分野であり、その考え方を日常生活や身近な事例を通じて直感的に理解できるよう工夫する。数式や複雑な計算は極力避け、リスク管理の基礎やオプション取引の仕組みを平易に解説する。特に、金融工学の代表的な成果であるブラック＝ショールズ方程式の考え方や意義を数式を使わずに解説し、リスク中立や裁定取引といった基本概念を説明する。また、金融工学の根幹をなす確率過程や株価のランダム性を紹介し、Itoのレンマを通じて数学的枠組みに触れることで金融工学の全体像を掴む。現代の金融市場で注目されるブロックチェーン技術の原理や応用事例も学び、既存の金融システムを補完し新しいモデルを生む可能性を考察する。金融工学が社会に与える影響について議論し、意義を深く理解できる内容を目指す。
  teachers:
    - name: 志村 美代子
- id: G114
  name: バイオインフォマティクス入門
  category: 専門教育科目
  area: 情報・工学系
  form: 講義
  grade: 3年次
  term: 前期・後期
  credits: 1
  required: false
  dp:
    - C
  summary: |-
    この講義では、バイオインフォマティクスの基礎から最新の応用までを学ぶ。最初に、生物学と情報科学を融合させたバイオインフォマティクスの意義と応用分野（ゲノム解析や構造解析）を理解し、現代社会における重要性を確認する。次に、DNA、RNA、タンパク質の基本構造や機能を学び、遺伝情報の流れ（セントラルドグマ）や分子構造の生命機能への影響を探る。
    配列解析やデータベース（NCBIやUniProt）を活用したデータ解析手法、構造生物学の基本概念と3次元構造解析の応用例についても学修する。また、AIを用いたバイオインフォマティクスの最新技術として、AlphaFoldによるタンパク質構造予測の仕組みや創薬への応用事例を深掘りし、その限界や今後の展望も考察する。本講義は、バイオインフォマティクスの可能性を幅広く学ぶ内容である。
  teachers:
    - name: 伊藤 聡志
- id: H115

    - C
  summary: |-
    本科目は、デザインの客観的な考え方と手法を学ぶ。
    ユーザーニーズと行動を理解するための定量的、定性的調査、製品やサービスをユーザーに適したものにするための有効性の評価で得られる情報は、デザインプロセスに必須である。製品やサービスデザインだけでなく、ビジネス戦略やマーケティング立案にも応用される。
    ニーズと行動を理解する調査手法には、フィールドワーク観察、インタビューやアンケートによる課題発見、ペルソナ・ターゲットユーザーを設定したシナリオ策定、要求仕様策定等がある。
    有効性の評価手法として、プロトタイプ等により、人間工学を基盤としたUXやユーザビリティ評価。競合分析や将来像想定のための外観印象評価等がある。事例紹介と体験を通し深い理解を得る。「プロダクトデザイン概論」は、バーチャル含め人間中心のデザイン創作の基礎的な考え方、手法を獲得し、補完するので本科目と組み合わせ受講すること。

  summary: |-
    交渉学は、対立する複数人の間の問題解決プロセスとして、実際に行われた交渉事例を分析し、問題解決の成功確率を上げる方法論として米国ハーバード大学の研究により構築された学問である。
    情報デザイン学部における交渉学概論は、コミュニケーション能力の核心である交渉力に焦点を当て、実践的なデザインプロジェクトにおいて効果的にコミュニケーションを行い、調整し、合意形成をするためのスキルを養う。
    交渉相手との異なる利害を理解し、プロジェクトのクリエイティブなプロセスにおける成功に向けて調整するスキルや、相手の要求をヒアリングし、言語化されない交渉相手のコンテキストを探索し、相手の要件や合意可能な範囲を明確にした上で、デザインプロセスにおける問題やコンフリクトに対処して創造的な解決策を見つける為のスキルを身につけて、効果的にコミュニケーションを図る能力を身につけることを目指す。
  teachers:
    - name: 三好 陽介

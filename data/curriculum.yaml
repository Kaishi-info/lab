- id: C012
  name: メディア史
  category: 基礎教育科目
  area: 一般教養
  form: 講義
  grade: 2年次
  term: 前期・後期
  credits: 1
  required: false
  dp:
    - A
  summary: メディア史は、人類が情報や文化を伝達し、共有してきた歴史を探求する学問領域である。この科目では、ラスコーの壁画から現代のデジタルメディアまで、メディアの進化と情報デザイン分野の諸学者としての体系的な基盤を学修する。まず古代の文字の発明から、西洋哲学における「美と芸術の理論」、印刷メディア、映像メディア、ラジオ、テレビ、そしてインターネット以降、動画やゲームといったエンタテイメントメディアまで、さまざまなメディアの発展を学問的に扱う。メディアが社会や文化に与える影響、情報の伝達方法の変化、そしてメディア技術が人々の生活や意識に与えてきた影響を学ぶ。この科目を通じて、過去から現在に至るまでのメディアの変遷が理解でき、未来のメディア環境に対する洞察を深めることができる。
  officeHours:

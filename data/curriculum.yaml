- id: A006
  name: テクニカル・リーディング
  category: 基礎教育科目
  area: 学修基盤
  form: 講義
  grade: 1年次
  term: 前期・後期
  credits: 2
  required: true
  dp:
    - A
  summary: この授業の主な目的は、目的に合った文章とそうでない文章を見分ける力を身につけることである。講義は、情報の構成やデザインの観点から進められる。具体的には、芸術的な文章と実用的な文章の違いを学び、さらに実用的な文章の中でも「テクニカル・ライティング」で書かれたものとそうでないものを区別する方法を学ぶ。一方2年次に開講される「テクニカル・ライティング」では、報告書や論文の書き方の基本を習得する。授業の初めには身近な情報に注目し、それぞれがどのように情報を読み解いているかを振り返る。その後、実験報告書や設計書そして研究論文などが、ヨーロッパの文化や価値観に基づいたテクニカル・ライティングの形式で書かれていることを学ぶ。本授業では、テクニカル・ライティングで作成された文章を正しく読み取れるテクニカル・リーディング力の修得を目指す。この能力は今後の実務や学問において有用であり社会でも活かせるスキルとなる。

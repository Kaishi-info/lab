- id: C010
  name: インターネット社会論
  category: 基礎教育科目
  area: 一般教養
  form: 講義
  grade: 2年次
  term: 前期・後期
  credits: 1
  required: true
  dp:
    - A
  summary: 社会のインターネット化による変化を情報デザインの視点で体系的に学ぶ。まず歴史的な視点からインターネットの起源と発展、その技術的基盤を理解するとともに、モバイルインターネット時代、社会のインターネット化、情報のバイアスや、プライバシー問題、個人情報の収集とプライバシーの問題といったリスクと管理。そしてオープンデータとオープンソースの利用の増大、新型コロナウイルスの事例を通した社会への適用といったIT技術の社会実装を考察する。後半は個人情報保護法と著作権法を学び、電子メールからビデオ会議、メタバースに至るまでの双方向コミュニケーションの進化を探り、デジタルマーケティングの用語、ビジネスコミュニケーションやオンラインコミュニティ形成における方法論的考察を深め、ミームや生成AI、フェイクニュースやオンライン文化の衝突についても考察し、インターネット社会の一員としての自覚を促していく。
  officeHours: []
  teachers:
    - name: 白井 暁彦
      slug: shirai-akihiko
- id: C011

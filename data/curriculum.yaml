  category: 基礎教育科目
  area: 一般教養
  form: 講義
  grade: 2年次
  term: 前期・後期
  credits: 2
  required: false
  dp:
    - A
  summary: |-
    現代社会において、ネットワーク技術に代表されるIT化による技術的な恩恵は非常に大きい。
    私達は、IT化がもたらす光の部分（利便性、娯楽性、簡便性）を享受し、様々な技術を選択統合しながら積極的に研究開発を推進していく一方で、影の部分、例えばネットワーク犯罪や軍事技術、大規模災害時の原子炉事故などによる被害等の拡大についても、十分考慮した上で、社会への技術導入を進めていく必要がある。
    この授業では、そうした情報化社会の倫理的側面や法的側面（ELSI: Ethical, Legal and Social Issues）に焦点を当て、国際社会の中で私達が何を考えていく必要があるのかについて学ぶ。

  category: 基礎教育科目
  area: 一般教養
  form: 講義
  grade: 1年次
  term: 前期・後期
  credits: 1
  required: false
  dp:
    - D
  summary: 現代日本において顕在化する社会問題についての理解を深めることを目的とする。日本では今後も人口減少・少子高齢化が進み、様々な分野に影響を与えると見込まれており、都市への人口集中と地方の疲弊、都市のスポンジ化(空洞化)、労働力不足、介護・福祉のミスマッチなどの深刻化の問題から、情報化、グローバル化の進展による働き方改革、ITの活用、国際交流と移民問題、地球環境問題などの発生など、現代社会が直面する問題をとりあげ、その背景と取り組むべき課題について学修する。また、これら内容のバックボーンとしての社会学についても取り扱う。

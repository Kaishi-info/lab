  summary: 本科目ビジネスリテラシーは、現代のビジネス環境に不可欠なファイナンスの基礎と、価値あるビジネスモデルを構築するための思考法（ビジネスアーキテクチャ）の基本を、生活・地域・起業といった身近な題材を通じて学ぶものである。売上・コスト・利益といった「データで考える力」と、ユーザー視点・業界構造・収益構造などの「仕組みで捉える力」を体験的かつ理論的に育成する。社会経験の有無に関わらず無理なく取り組めるよう配慮されており、講義では理論的枠組みと実践的事例を交えながら、ビジネスの構造と機能を多角的に考察する。本科目は、ビジネス系専門科目（ファイナンス、ビジネスアーキテクチャ、ビジネスインテリジェンス等）への橋渡しとなる導入科目として、学習の方向性を定め、自身の関心領域や将来のキャリア形成に資する知的基盤を提供する。
  teachers:

  summary: 量子コンピュータは非常に注目を集めており、世界中の大企業がその開発に乗り出している。しかし注目を集める一方で、その科学技術について精確な理解は得られておらず、不正確な説明を行うウェブニュースに遭遇することも多い。これは量子コンピュータの原理が線形代数と呼ばれる数学に基づいているからである。本科目では、必要な線形代数について復習を行った後、量子情報の公理や主要な量子回路の性質を学ぶ。集大成として、暗号の安全性の中核を成す冪剰余の位数発見問題を量子コンピュータで高速で解いてしまうが故に、量子情報理論が世界中で流行する学術分野になったきっかけとなったShorのアルゴリズムについて学修する。以上は全て抽象的な数学理論に基づいているが、それを具体的な学修によって補完すべく、クラウド量子コンピュータIBM quantumや量子コンピュータの為のフレームワーク Qiskit を適宜用いる。

messages:
  - audience: 高校生のみなさんへ
    heading: しくみを学んで“創る側”へ踏み出そう！
    body: 現代社会では、色々なところでコンピュータが活躍しています。そんなコンピュータが、どんな技術により作られているかに興味はありませんか？コンピュータの技術は、新しいモノを創るときの土台となります。コンピュータを足がかりに、一緒に新しいモノを創りましょう！
  - audience: 社会人のみなさんへ
    heading: 基盤技術の理解がキャリアの幅を広げる
    body: ITエンジニアとして仕事の幅を広げるには、コンピュータがどのような技術で作られているかを知ることが大切です。ビジネスマンとしても、その知識は色々な場面で役立つでしょう。新しい未来に向けて一緒に学びましょう。

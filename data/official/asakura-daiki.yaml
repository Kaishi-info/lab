    body: たくさんの学校の中から私達の大学に興味を持ってくださりありがとうございます．私達は，皆さんひとりひとりのペースで学ぶことの出来るオンライン空間を提供する大学です． 好きなことや得意なことから始めてください．苦手なことや分からないことはすぐに私達に相談して学び直すことが出来ますから．皆さんにオンライン上でお会い出来ることを楽しみにしています．
  - audience: 社会人のみなさんへ

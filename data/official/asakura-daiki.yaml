    body: リスキリングの種類も方向性も多様になっていくなかで，私達の大学に興味を持ってくださりありがとうございます．私達の大学は，皆様おひとりおひとりのペースでじっくりと学ぶことの出来る場所を提供します．仕事・家事・育児・介護の合間に学ぶことが出来ます．短い時間でも学習を何回も何回も積み重ねれば，やがて確かな力が得られることでしょう．その学習を私達は丁寧にサポートいたします．

messages:
  - audience: 高校生のみなさんへ
    heading: デジタルの海へ。AIと共に、まだ見ぬ将来へ！
    body: 世界中のどこにいても、あなたの未来はここから描き始められます。AIという新しいパートナーと共に、自分の中に眠る「志を開く」こと。それこそが、私たちが大切にする「開志」です。単なるスキルを超えて、自らの手で「人生をデザインする」力を手に入れませんか。2026年、デジタルの海でお会いしましょう。
  - audience: 社会人のみなさんへ
    heading: AIを鏡に、自らの手で人生をデザインする
    body: 世界中のどこにいても、あなたのキャリアは新しく描き直せます。最新のAIを鏡として使い、内なる「志を開く」こと。それこそが私たちが掲げる「開志」の本質です。既存の枠組みに受動的に従うのではなく、自らの手で「人生をデザインする」力を手に入れませんか。2026年、デジタル空間で共に未来を記述しましょう。

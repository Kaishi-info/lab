  - audience: 高校生のみなさんへ
    heading: 好きなことから未来のエンジニアへ
    body: 「好き」を未来の創造力に！プログラミングの土台から、ワクワクするWebアプリケーションの仕組みまで、あなたのペースでじっくり学びましょう。初めてでも大丈夫。知識だけでなく、考え方や創造性を育みながら、情報システムの未来を担うエンジニアへの夢を一緒に叶えていきましょう！
  - audience: 社会人のみなさんへ
    heading: 学び直しでキャリアに新しい価値を
    body: もっと深く、楽しく学び直して、あなたのキャリアに新たな価値を加えませんか？システムの設計論やデータ活用法といった、現場で活きる専門知識を丁寧に解説します。知的好奇心を満たしながら、実践的なスキルを習得し、最新のテクノロジーで仕事の可能性を大きく広げましょう。

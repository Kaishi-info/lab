  - audience: 高校生のみなさんへ
    heading: わかる喜びが未来を広げる！
    body: 学ぶことには、「わかるって、ちょっと気持ちいい」という瞬間があります。まだ将来が決まっていなくても、その小さな喜びを積み重ねることで、できることが広がっていきます。あなたが、自分のペースで世界をひらいていく手助けができればと思っています。一緒に学んでみませんか。
  - audience: 社会人のみなさんへ
    heading: 自分のペースで深める大人の学び
    body: 大人になってからの学びは、これまでの経験とつながることで、より深い“わかる喜び”になります。忙しい日々でも、少しずつ前に進むことで、新しい視点や選択肢が生まれます。自分の生活に合わせて続けられる学びを、一緒に作っていきましょう。

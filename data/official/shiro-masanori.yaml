messages:
  - audience: 高校生のみなさんへ
    heading: AIと自由を使い倒せ。君が作る、一期生の歴史
    body: いい時代になったものよ。ふとんの中で授業をきける。バックパッカーとして外国を放浪しながらでも授業をきける。そして学費は超安い。バイトだけでなんとかなる。あまった時間を個性的に使える。それに、なんといっても新しい大学の一期生なんて気分いいじゃないか。
  - audience: 社会人のみなさんへ
    heading: 失われない一生の財産を。知識は裏切らない
    body: 実は僕も就職してから学校に通い直した社会人学生だった。日々削られている人生の残り時間をどう使うか結構悩んだが、知識を得るために努力することは悪くない選択肢だ。美味いメシだって1年も経てば忘れる。人に尽くしても人は去っていく。でも知識は残る。この学校を見つけたあなたは幸運なのだと思う。

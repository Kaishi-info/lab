messages:
  - audience: 高校生のみなさんへ
    heading: ソフトウェアで未来の社会を動かそう
    body: ソフトウェアは、パソコンやスマートフォンだけで動くものではありません。自動車や家電品、それらを作る工場も、ソフトウェアがなければ動かない時代です。本校では、ソフトウェアに関わるための力を基礎からしっかり身につけることができます。あなたもその力を身につけて、社会のためになる人材になってみませんか。
  - audience: 社会人のみなさんへ
    heading: 基礎から学び先端技術を活かす人材に
    body: ソフトウェアは、パソコンやスマートフォン上だけで動くものではありません。みなさんが使う家電品や自動車、それらを生産するための工場や発電所もソフトウェアがなくては動くことができません。本校では、ソフトウェア作れる人材・活用できる人材を目指して、自分のペースで基礎から先端技術まで学ぶことができます。

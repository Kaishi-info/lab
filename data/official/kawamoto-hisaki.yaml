    body: 社会で活躍する人材になるためには、情報科学に関する知識やスキルを身につけるだけでは十分とは言えません。科学技術の発展による社会変化や人の行動変容を把握し、戦略的に経営とビジネスを考える力を同時に養っていきましょう。

messages:
  - audience: 高校生のみなさんへ
    heading: 情報力と発想力で未来を切り開こう！
    body: 社会では、情報を正しく読み取り、今起きていることを理解し、自分でやるべきことを見つけて動く力が大切になります。情報リテラシーはその土台となり、デザイン思考は問題を見つけてアイデアを形にする力につながります。大学の学びや将来の仕事にも生きる力を、ここで育てていきましょう。
  - audience: 社会人のみなさんへ
    heading: 情報整理とデザイン思考で成果を創る
    body: 働く中で触れる情報は多く、判断の早さや正確さが求められる場面が増えています。情報リテラシーは必要な情報をつかみ、整理し、適切に使うための強い味方になります。また、デザイン思考は、現場で起きる問題から新しい提案や改善策を生み出す力として、多くの職種で生かすことができます。学びを通して、これからのキャリアをより確かなものにしていけます。

messages:
  - audience: 高校生のみなさんへ
    heading: 情報技術で好きな世界を学びましょう
    body: 世の中にはたくさんの「コンテンツ」があふれており、Webやアプリを通して様々なコンテンツに触れることができます。私が専門とするメディア情報学では、コンテンツとそれを扱うメディアを、情報技術を駆使して処理する方法について学ぶ学問です。きっと皆さんの興味にあったテーマもあるはずです。AIやプログラミングといった情報技術を用いて自分の好きなテーマを題材に一緒に学んでみませんか！
  - audience: 社会人のみなさんへ
    heading: 今こそ学ぶ、情報×AI利活用の力
    body: 情報デザイン学部で学ぶ「情報学」は、情報の生成・流通・管理といった情報に関連するさまざまな知識・スキルについて学びます。生成AIの流行などにより社会で求められる知識・スキルも変わってきていますが、人間・社会の問題をテーマとして扱う「情報学」は今だからこそ学ぶべき学問といえます。ともに情報・AIの利活用のスキルを身に着けていきましょう！

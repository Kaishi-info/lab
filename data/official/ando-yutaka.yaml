messages:
  - audience: 高校生のみなさんへ
    heading: 「好き」を科学で解き明かそう
    body: ラーメンひとつでも「さっぱり派」や「こってり派」など好みって人それぞれですよね。説明しようと思ってもうまく言えなかったり、自分でも何が好きなのか分からない時ってありませんか？そんな「好き」の理由を科学の力で解き明かすのが「感性工学」です。人の感覚や感情を測定・分析し、その仕組みを理解することで、使いやすさや心地よさを感じる商品やサービスをつくることができます。身の回りのモノや気持ちに興味がある人、ぜひ一緒に学んでみませんか？
  - audience: 社会人のみなさんへ
    heading: 感性を科学で読み解きビジネスに活かす
    body: 顧客の「好き」の理由を理解することは、ビジネスにとって大きな価値があります。しかし、感覚的なことであるがゆえに、測定や分析、実装が難しいという課題があります。感性工学は、科学的手法を用いて人の気持ちを定量的に記述し、根拠に基づいた意思決定を可能にします。実務で活躍する力をさらに磨きたい方、ぜひ一緒に学んでみませんか。

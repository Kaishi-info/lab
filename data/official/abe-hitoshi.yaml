messages:
  - audience: 高校生のみなさんへ
    heading: ひらめきを社会に届ける力を育てよう！
    body: あなたの“ひらめき”は、世界を変えるはじまり。その想いをかたちにして、守り・伝える力――それが知的財産です。情報デザインと知的財産の学びを通じて、自らの創造が人々を動かし、社会をより豊かにしていく瞬間を、一緒に創り出していきましょう。
  - audience: 社会人のみなさんへ
    heading: 知的財産とデザインで社会を動かす力を
    body: あなたの創造したアイデアやデザインを守り、発展させて価値に変える力――それが知的財産です。情報デザインと知的財産を融合させることで、あなたの経験や発想が新たなビジネスと社会を動かす原動力になります。実践的な学びを通して、新しい未来を共に切り拓いていきましょう。

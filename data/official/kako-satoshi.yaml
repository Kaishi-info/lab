messages:
  - audience: 高校生のみなさんへ
    heading: 学びとアイデアで新しい世界へ！
    body: 情報技術は、ソフトウェアとハードウェアを両輪として新しい価値を生み出してきました。物理を学ぶことで、コンピュータや通信の仕組みを理解し、IoTやロボットなど、これから広がる分野に挑戦するチャンスが増えます。こうした知識は、発想を広げ、新しいビジネスの可能性を生み出す力にもなります。大学での学びとあなたのアイデアで未来を切り開いていきましょう。
  - audience: 社会人のみなさんへ
    heading: 経験と知識で次世代サービスを創る
    body: 情報技術を使ったビジネスは、これからさらに多様になります。物理を学ぶことは、ソフトウェアとハードウェア両方を組み合わせた新しいサービスや製品のアイデアの幅を広げ、環境やエネルギーなど次の時代に必要な分野にも対応する基盤を与えます。大学での学びは、あなたのキャリアに新しい選択肢を加えるでしょう。あなたのこれまでの経験と大学での学びを融合させ、未来を切り開く挑戦を始めませんか？

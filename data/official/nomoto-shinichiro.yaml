messages:
  - audience: 高校生のみなさんへ
    heading: 社会で活きる力を実践で身につけよう！
    body: 私の講座は、未来のキャリアを切り拓く“武器”をつくる実践型授業です。品質管理やグローバル人材育成、地域おこし論などのリアルなテーマで、社会で即戦力になる力を徹底的に鍛えます。大学で本気で成長したい人、仲間として一緒に挑戦しましょう！
  - audience: 社会人のみなさんへ
    heading: 学び直しでキャリアを一段引き上げる
    body: 私の講座は、実務に直結する“学び直しの武器”をつくる実践型授業です。品質管理、グローバル人材、地域づくりなど現場で使えるテーマを扱い、仕事にすぐ活かせる力を磨きます。キャリアをもう一段引き上げたい社会人の方、ぜひ一緒に成長しましょう。

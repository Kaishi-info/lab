messages:
  - audience: 高校生のみなさんへ
    heading: 夢を学びでカタチにするチャンス！
    body: 息子に「宇宙大工」になりたいとうちあけられました。ロボットを使って宇宙基地をつくりたいと。「建築学」「ロボット工学」「宇宙工学」を学ぶ必要があると伝えると、目をキラキラさせながら、3つ勉強していいの？と言われました。次世代の多様な人材をタイムリーにオンライン育成するために着任します。来たれ！学生。
  - audience: 社会人のみなさんへ
    heading: リスキリングで未来のキャリアを拓く
    body: 現在は、IT革命の真っただ中。生涯学習を行い、常にリスキリングすることが重要です。自身の多彩な才能を副業でマネタイズすることもできるようになってきました。私は産学剣の連携を目指し、剣道で毎週心身を鍛え、経営者と研究者をしています。一緒に、研鑽し、社会課題を解決しましょう。待っています！

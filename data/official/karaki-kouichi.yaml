messages:
  - audience: 高校生のみなさんへ
    heading: 面白い学びが将来をつくる一歩になる！
    body: 私自身の大学の思い出は勉学以外がほとんどで、友達と麻雀したり旅行に行ったりなどばかりです。本学は通信制なので、友人との交流は簡単ではないかもしれません。とはいえ、交流には力を入れてもらいたいです。それ以外では、しっかり勉強しましょう。「面白い」と思った勉強は、いつか何らかの形で役に立ちます。
  - audience: 社会人のみなさんへ
    heading: 経験を武器に学び直しを楽しむ場へ
    body: 私自身が銀行に13年あまり勤めたのちに大学院で学びなおしに取り組んだ経験者です。フルタイムで「通い」の大学院ですので、本学とは異なる面が多いかもしれません。とはいえ、大学という場での社会人のビジネス経験というアドバンテージは大きいです。それを活かしつつ、楽しんで学んでいただきたいと考えます。

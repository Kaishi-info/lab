# Cloudflare Pages に公開する（質問フォームの送信は同じプロジェクトの Pages Functions: functions/）
# - main への push / 定期実行 → 本番（https://kaishi-lab.pages.dev 、のちに lab.kaishi.ac.jp）
# - PR → プレビュー（https://<ブランチ名>.kaishi-lab.pages.dev）。URL を PR にコメントする
# 必要な Secrets: CLOUDFLARE_API_TOKEN（Account / Cloudflare Pages / Edit）, CLOUDFLARE_ACCOUNT_ID
# 通知先（Resend・Slack など）は GitHub ではなく Cloudflare Pages 側の環境変数（pnpm secrets）
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # フォークからの PR には Secrets が渡らないのでプレビューはスキップ（CI のチェックは動く）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 定期実行から呼ばれたときは、直前に push したフィードを含む最新の main を使う
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kaishi-lab --branch=${{ github.head_ref || 'main' }}
      - name: プレビュー URL を PR にコメント
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pages.outputs.deployment-alias-url || steps.pages.outputs.deployment-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "プレビューができました: $URL （このPRの変更を反映した見た目を確認できます）"
